# Standalone file, not merged into compose.yaml. A separate official Appwrite
# installation must already exist on AUDIT_APPWRITE_NETWORK with production's
# discovered image digests. Never attach to the production Appwrite network.
name: ifm-audit
services:
  api:
    image: ${AUDIT_API_IMAGE:?Set the locally built audit API image}
    env_file:
      - ${AUDIT_BACKEND_ENV:?Absolute external test env path is required}
    ports:
      - "${AUDIT_BIND_ADDRESS:-127.0.0.1}:${AUDIT_API_PORT:-18091}:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [audit, appwrite]
    mem_limit: 512m
    memswap_limit: 768m
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: ${AUDIT_REDIS_IMAGE:?Use the discovered production Redis image digest}
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, volatile-ttl]
    networks: [audit]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
  web:
    image: ${AUDIT_WEB_IMAGE:?Set the locally built audit web image}
    ports:
      - "${AUDIT_BIND_ADDRESS:-127.0.0.1}:${AUDIT_WEB_PORT:-18088}:8080"
    networks: [audit, published]
    volumes:
      - "./tests/load/audit-nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${AUDIT_RESOURCE_DIR:?Separate non-secret resource directory is required}:/usr/share/nginx/html/audit-resources:ro"
    mem_limit: 128m
    memswap_limit: 192m
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
networks:
  audit: {internal: true}
  published: {}
  appwrite:
    external: true
    name: ${AUDIT_APPWRITE_NETWORK:?A dedicated audit Appwrite network is required}
