services:
  api:
    build:
      context: ./backend-api
    env_file:
      - .env.backend
    ports:
      - "127.0.0.1:${MENU_API_PORT:-8091}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
