server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite bundles can be cached indefinitely; the entry document must
    # always be revalidated so TVs receive a new deployment promptly.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Previously generated Firebase renderer links use /display/<token>.<secret>.
    # The Appwrite client normalizes them to the current hash URL in index.html,
    # so keep these legacy links on the SPA instead of returning a dotted-path 500.
    location ~ ^/display/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
