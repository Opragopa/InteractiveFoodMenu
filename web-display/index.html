<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Меню</title>
    <script>
      (function (navigator, window) {
        var userAgent = navigator.userAgent || "";
        var webOs = /Web0S|webOS/i.test(userAgent);
        var tizen = /Tizen\s+(\d+(?:\.\d+)?)/i.exec(userAgent);
        var samsungTv = /SMART-TV|TV Safari/i.test(userAgent);
        // Tizen 5.5 uses Chromium 69; Tizen 6 moves to Chromium 76.
        var legacySamsung = samsungTv && tizen && parseFloat(tizen[1]) < 6;
        var display = /^#([A-Za-z0-9_-]{12,40})\.([A-Za-z0-9_-]{32,80})$/.exec(window.location.hash);
        if ((webOs || legacySamsung) && window.location.pathname === "/connect") {
          window.location.replace("/connect-legacy.html");
          return;
        }
        if ((webOs || legacySamsung) && window.location.pathname === "/" && display) {
          window.location.replace("/display/" + display[1] + "." + display[2]);
        }
      })(navigator, window);
    </script>
  </head>
  <body>
    <div id="root"><main class="startup-status">Загрузка меню…<p><a href="/connect-debug.html">Открыть диагностику ТВ</a></p></main></div>
    <noscript><main class="startup-status">Для показа меню на телевизоре нужен JavaScript.</main></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
