<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Меню</title>
    <script>
      (function (navigator, window) {
        var userAgent = navigator.userAgent || "";
        var webOs = /Web0S|webOS/i.test(userAgent);
        var webOsVersion = /(?:Web0S|webOS)[\s/]+(\d+(?:\.\d+)?)/i.exec(userAgent);
        var tizen = /Tizen\s+(\d+(?:\.\d+)?)/i.exec(userAgent);
        var chromeVersion = /(?:Chrome|Chromium)\/(\d+)/i.exec(userAgent);
        var samsungTv = /SMART-TV|TV Safari/i.test(userAgent);
        // Tizen 5.5 uses Chromium 69; Tizen 6 moves to Chromium 76.
        var legacySamsung = samsungTv && tizen && parseFloat(tizen[1]) < 6;
        var legacyPathDisplay = /^\/display\/([A-Za-z0-9_-]{12,40})\.([A-Za-z0-9_-]{32,80})$/.exec(window.location.pathname);
        var hashDisplay = /^#([A-Za-z0-9_-]{12,40})\.([A-Za-z0-9_-]{32,80})$/.exec(window.location.hash);
        var oldWebOs = webOs && (!webOsVersion || parseFloat(webOsVersion[1]) < 4);
        var oldTv = oldWebOs || legacySamsung || typeof window.fetch !== "function";
        var legacyChromium = chromeVersion && parseInt(chromeVersion[1], 10) < 49;
        if (legacyChromium || oldTv) document.documentElement.className += " legacy-tv";
        // Some older TVs do not identify themselves as webOS/Tizen but still
        // lack fetch. The static XHR-based page is compatible with them.
        if (oldTv && window.location.pathname === "/connect") {
          window.location.replace("/connect-legacy.html");
          return;
        }
        // Legacy TV displays stay in React; the ES5 entry supplies fetch and
        // language polyfills. The connect flow remains XHR-based.
        if (legacyPathDisplay) {
          window.location.replace("/#" + legacyPathDisplay[1] + "." + legacyPathDisplay[2]);
        }
      })(navigator, window);
    </script>
  </head>
  <body>
    <div id="root"><main class="startup-status">Загрузка меню…<p><a href="/connect-debug.html">Открыть диагностику ТВ</a></p></main></div>
    <noscript><main class="startup-status">Для показа меню на телевизоре нужен JavaScript.</main></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
