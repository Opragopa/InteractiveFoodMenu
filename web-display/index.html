<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Меню</title>
    <script>
      (function (navigator, window) {
        var userAgent = navigator.userAgent || "";
        var webOs = /Web0S|webOS/i.test(userAgent);
        var tizen = /Tizen\s+(\d+(?:\.\d+)?)/i.exec(userAgent);
        var samsungTv = /SMART-TV|TV Safari/i.test(userAgent);
        // Tizen 5.5 uses Chromium 69; Tizen 6 moves to Chromium 76.
        var legacySamsung = samsungTv && tizen && parseFloat(tizen[1]) < 6;
        var legacyDisplay = /^\/display\/([A-Za-z0-9_-]{12,40})\.([A-Za-z0-9_-]{32,80})$/.exec(window.location.pathname);
        // Some older TVs do not identify themselves as webOS/Tizen but still
        // lack fetch. The static XHR-based page is compatible with them.
        if ((webOs || legacySamsung || typeof window.fetch !== "function") && window.location.pathname === "/connect") {
          window.location.replace("/connect-legacy.html");
          return;
        }
        // Old Firebase renderer links are still found on previously paired TVs.
        // The Appwrite web stack serves the SPA at /, so normalize those links
        // back to the current hash URL instead of leaving the TV on a dead path.
        if (legacyDisplay) {
          window.location.replace("/#" + legacyDisplay[1] + "." + legacyDisplay[2]);
        }
      })(navigator, window);
    </script>
  </head>
  <body>
    <div id="root"><main class="startup-status">Загрузка меню…<p><a href="/connect-debug.html">Открыть диагностику ТВ</a></p></main></div>
    <noscript><main class="startup-status">Для показа меню на телевизоре нужен JavaScript.</main></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
