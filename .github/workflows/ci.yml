name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  web-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            web-display/package-lock.json
      - run: npm ci --prefix backend-api
      - run: npm ci --prefix web-display
      - run: npm test
      - run: npm run integration
      - run: npm run coverage
      - run: npm run mutation
      - run: npm run build
      - run: docker build -t interactivefoodmenu-api:ci backend-api
      - run: docker build -t interactivefoodmenu-web:ci -f Dockerfile.web .

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :android:testDebugUnitTest :android:assembleDebug

  deploy-production:
    name: Deploy production
    needs: [web-api, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Deploy with the active Docker Desktop session
        shell: powershell
        env:
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROD_PATH)) { throw 'Missing PROD_PATH secret' }
          & .\scripts\deploy-production.ps1 -ExpectedCommit $env:GITHUB_SHA -RepoPath $env:PROD_PATH
