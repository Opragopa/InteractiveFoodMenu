services:
  # Backend-neutral API. Appwrite is installed separately on the host and is
  # reachable only through its loopback port and this private container link.
  api:
    build:
      context: ./backend-api
    env_file:
      - .env.backend
    ports:
      - "127.0.0.1:${MENU_API_PORT:-8091}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - menu_internal
      - backend_outbound
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Internal web proxy retained for container-to-container development only.
  # On Windows the host Nginx connects directly to the web container below.
  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./docker/nginx/menu-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - menu_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Builds the TV and staff web interface once. Browser clients use only the
  # neutral API exposed by the host Nginx at /api.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-/api}
    # The host Nginx owns public 80/443 and forwards the site here. Publishing
    # this directly avoids an unreliable extra Docker port forward on Windows.
    ports:
      - "127.0.0.1:${MENU_PROXY_PORT:-8088}:8080"
    networks:
      - menu_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Development-only Firebase Emulator Suite. Never publish this profile to
  # the internet; it does not run with the production web deployment above.
  backend:
    profiles: ["emulators"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-interactivefoodmenu}
      ENFORCE_APP_CHECK: "false"
      # Used by seed and by server-rendered display links when supplied.
      DISPLAY_BASE_URL: ${DISPLAY_BASE_URL:-}
    ports:
      - "4000:4000" # Emulator Suite UI
      - "5001:5001" # Cloud Functions
      - "8080:8080" # Firestore
      - "9099:9099" # Authentication
      - "9199:9199" # Storage
    volumes:
      - firebase-emulator-data:/srv/app/.firebase-data
    # This is a local development backend. Do not hide a startup error behind
    # an automatic restart loop; inspect it with `docker compose logs backend`.
    restart: "no"
    init: true
    stop_grace_period: 30s

networks:
  menu_internal:
    internal: true
  backend_outbound:

volumes:
  firebase-emulator-data:
