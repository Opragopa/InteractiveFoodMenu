x-runtime-api: &runtime-api
  mem_limit: 512m
  memswap_limit: 768m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-runtime-web: &runtime-web
  mem_limit: 128m
  memswap_limit: 192m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-runtime-proxy: &runtime-proxy
  mem_limit: 64m
  memswap_limit: 96m
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  # Backend-neutral API. Appwrite is installed separately on the host and is
  # reachable only through its loopback port and this private container link.
  api:
    <<: *runtime-api
    build:
      context: ./backend-api
    env_file:
      - .env.backend
    ports:
      - "127.0.0.1:${MENU_API_PORT:-8091}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - menu_internal
      - backend_outbound
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Internal web proxy retained for container-to-container development only.
  # On Windows the host Nginx connects directly to the web container below.
  proxy:
    <<: *runtime-proxy
    image: nginx:1.28-alpine
    volumes:
      - ./docker/nginx/menu-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - menu_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Builds the TV and staff web interface once. Browser clients use only the
  # neutral API exposed by the host Nginx at /api.
  web:
    <<: *runtime-web
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-/api}
        VITE_BUILD_VERSION: ${BUILD_VERSION:-unknown}
    # The host Nginx owns public 80/443 and forwards the site here. Publishing
    # this directly avoids an unreliable extra Docker port forward on Windows.
    ports:
      - "127.0.0.1:${MENU_PROXY_PORT:-8088}:8080"
    networks:
      - menu_internal
      # Docker Desktop for Windows does not publish a host port from a service
      # connected exclusively to an `internal: true` network. This is still
      # private: the port above is bound only to host loopback.
      - backend_outbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  menu_internal:
    internal: true
  backend_outbound:
