services:
  # Public entry point for this Compose project. It is bound to loopback only:
  # the existing host Nginx owns ports 80/443 and proxies to this port.
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${MENU_PROXY_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/menu-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - menu_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Builds the TV and staff web interface once. Firebase remains external:
  # browser clients talk directly to the production Firebase project.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY in .env.deploy}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN in .env.deploy}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID in .env.deploy}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Set VITE_FIREBASE_STORAGE_BUCKET in .env.deploy}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID in .env.deploy}
        VITE_FIREBASE_FUNCTIONS_REGION: ${VITE_FIREBASE_FUNCTIONS_REGION:-europe-west1}
        VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${VITE_RECAPTCHA_ENTERPRISE_SITE_KEY:-}
        VITE_DISPLAY_BASE_URL: ${VITE_DISPLAY_BASE_URL:?Set VITE_DISPLAY_BASE_URL in .env.deploy}
        VITE_USE_EMULATORS: "false"
        VITE_DEMO_MODE: "false"
    networks:
      - menu_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Development-only Firebase Emulator Suite. Never publish this profile to
  # the internet; it does not run with the production web deployment above.
  backend:
    profiles: ["emulators"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-interactivefoodmenu}
      ENFORCE_APP_CHECK: "false"
      # Used by seed and by server-rendered display links when supplied.
      DISPLAY_BASE_URL: ${DISPLAY_BASE_URL:-}
    ports:
      - "4000:4000" # Emulator Suite UI
      - "5001:5001" # Cloud Functions
      - "8080:8080" # Firestore
      - "9099:9099" # Authentication
      - "9199:9199" # Storage
    volumes:
      - firebase-emulator-data:/srv/app/.firebase-data
    # This is a local development backend. Do not hide a startup error behind
    # an automatic restart loop; inspect it with `docker compose logs backend`.
    restart: "no"
    init: true
    stop_grace_period: 30s

networks:
  menu_internal:
    internal: true

volumes:
  firebase-emulator-data:
